name: iOS

# Os runners macOS gastam 10x mais minutos do que os Linux em repositórios privados.
# Por isso este workflow só corre manualmente ou ao criar uma tag v*.
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Tipo de IPA (só se houver certificado e perfil nos segredos)
        type: choice
        options: [development, ad-hoc, app-store-connect]
        default: development
  push:
    tags: ['v*']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26 # Xcode 26+ (exigido pelo Capacitor 8)
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_ENABLE_STORAGE: ${{ vars.VITE_ENABLE_STORAGE }}
      VITE_ENABLE_FUNCTIONS: ${{ vars.VITE_ENABLE_FUNCTIONS }}
      VITE_SHOW_DESIGN_SYSTEM: ${{ vars.VITE_SHOW_DESIGN_SYSTEM }}
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web (React + Vite)
        run: npm run build

      - name: Preparar projeto iOS (cap add / assets / sync)
        run: bash scripts/ci/prepare-native.sh ios

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Definir versão
        id: meta
        env:
          OFFSET: ${{ vars.IOS_BUILD_OFFSET || 0 }}
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build=$(( GITHUB_RUN_NUMBER + OFFSET ))" >> "$GITHUB_OUTPUT"

      - name: Compilar para o simulador (verificação, sem conta Apple)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
        run: bash scripts/ci/ios-build.sh simulator

      - name: Guardar .app do simulador (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: seu-carrinho-ios-simulator
          path: build/ios/SeuCarrinho-ios-simulator.zip
          if-no-files-found: error
          retention-days: 30

      - name: Assinar e exportar IPA
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          METHOD: ${{ inputs.export_method || 'development' }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/ci/ios-build.sh export "$METHOD"

      - name: Guardar IPA (artifact)
        if: env.HAS_IOS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seu-carrinho-ios-ipa
          path: build/ios/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Seu Carrinho — iOS"
            echo "- Versão: ${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.build }})"
            if [ "$HAS_IOS_SIGNING" = "true" ]; then
              echo "- IPA assinado nos artifacts."
            else
              echo "- Sem certificado/perfil: só foi gerado o .app de simulador (serve para confirmar que compila; não instala num iPhone)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
