name: Android — gerar keystore (executar uma única vez)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: Alias da chave
        default: seucarrinho
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gerar keystore
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail
          mkdir out
          STORE_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$STORE_PASS"
          keytool -genkeypair -v -keystore out/release.keystore -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=Seu Carrinho, O=Bug Shop, C=AO" >/dev/null
          {
            echo "ANDROID_KEYSTORE_BASE64=$(base64 -w0 out/release.keystore)"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$STORE_PASS"
          } > out/keystore-secrets.txt
          {
            echo "### Keystore criada"
            echo "Impressão digital (não é segredo):"
            keytool -list -v -keystore out/release.keystore -storepass "$STORE_PASS" | grep -E 'SHA256:'
            echo ""
            echo "Descarrega o artifact **keystore-secrets**, copia os 4 valores para GitHub > Settings > Secrets and variables > Actions > Secrets,"
            echo "guarda uma cópia do ficheiro num local seguro e **apaga o artifact**."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: out/
          retention-days: 1
